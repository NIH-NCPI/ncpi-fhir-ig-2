name: 🚀 Deploy IG Site Preview

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  publish:
    name: 📝 Preview Implementation Guide
    runs-on: ubuntu-22.04
    steps:
      - name: 👩‍💻 Checkout code
        uses: actions/checkout@v3

      - name: 🛠 Set up OpenJDK
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: 🛠 Set up Jekyll
        run: |
          sudo apt-get update
          sudo apt-get -y install ruby-full build-essential zlib1g-dev
          sudo gem install jekyll bundler

      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: 🛠 Install GA4GH Pedigree FHIR IG package
        run: |
          mkdir -p ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"
          curl -L https://ga4gh.github.io/pedigree-fhir-ig/package.tgz -o /tmp/ga4gh-pedigree.tgz
          tar -xzf /tmp/ga4gh-pedigree.tgz -C ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"
          ls -la ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"/package/StructureDefinition-PedigreeRelationship.json

      - name: 🛠 Install SUSHI and add FSH definitions
        run: |
          npm install -g fsh-sushi
          sushi .

      - name: ⬆️ Update IG publisher
        run: |
          sudo apt-get -y install iputils-ping
          chmod +x ./_updatePublisher.sh
          ./_updatePublisher.sh -y

      - name: 🚦 Validate IG
        run: |
          chmod +x ./_genonce.sh
          ./_genonce.sh
      - name: 📦️ Capture FSH-Generated
        run: |
          ./_build_fgen_index.rb

      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v1.2
        id: netlify
        with:
          publish-dir: "./output"
          deploy-message: "🚀 Deploy from GitHub Actions"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alias: deploy-preview-${{ github.event.number }}
          fails-without-credentials: true
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: 🏷 PR Deploy Preview Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### :rocket: IG Site Preview Deployed

            Latest commit: ${{ github.event.pull_request.head.sha }}

            [View deployment](${{ steps.netlify.outputs.deploy-url }})
