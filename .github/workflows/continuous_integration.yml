name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Implementation Guide
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Check out branch
        uses: actions/checkout@v2

      - name: Set up OpenJDK
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Set up Jekyll
        run: |
          sudo apt-get update
          sudo apt-get -y install ruby-full build-essential zlib1g-dev
          sudo gem install jekyll bundler

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install GA4GH Pedigree FHIR IG package
        run: |
          mkdir -p ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"
          curl -L https://ga4gh.github.io/pedigree-fhir-ig/package.tgz -o /tmp/ga4gh-pedigree.tgz
          tar -xzf /tmp/ga4gh-pedigree.tgz -C ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"
          ls -la ~/.fhir/packages/"ga4gh.fhir.pedigree#0.1.0"/package/StructureDefinition-PedigreeRelationship.json

      - name: Install SUSHI and add FSH definitions
        run: |
          npm install -g fsh-sushi
          sushi .

      - name: Update IG publisher
        run: |
          sudo apt-get -y install iputils-ping
          chmod +x ./_updatePublisher.sh
          ./_updatePublisher.sh -y

      - name: Validate IG
        run: |
          chmod +x ./_genonce.sh
          ./_genonce.sh
